name: yac
services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      YAC_DOMAIN: ${YAC_DOMAIN:?required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - ./downloads:/srv/downloads:ro
      - ../../server/YetAnotherCat.Api/wwwroot:/srv/web:ro
    mem_limit: 128m
    depends_on: [api, minio]
    networks:
      default:
        ipv4_address: 172.29.6.254
  api:
    image: yac-api:0.12.0
    build:
      context: ../..
      dockerfile: infra/public/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    env_file: ./secrets/backend.env
    environment:
      YAC_ROOT: /yac
      YAC_TRUSTED_PROXY: 172.29.6.254
      YAC_FINALIZED_BLOCK_CACHE: /yac/.dev/finalized-block-cache
      YAC_RPC_METRICS: "true"
      DOTNET_GCHeapHardLimit: "0x10000000"
    volumes:
      - ./secrets/deployment.json:/run/yac/deployment.json:ro
      - ./secrets/publisher.json:/run/yac/publisher.json:ro
      - api-data:/yac/.dev
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/api/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ./secrets/postgres.env
    command:
      ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-yac.sh:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yac"]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    env_file: ./secrets/storage.env
    command: server /data --console-address :9001
    volumes: ["manifests:/data"]
    mem_limit: 256m
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    env_file: ./secrets/storage.env
    volumes: ["./init-storage.sh:/init-storage.sh:ro"]
    entrypoint: ["/bin/sh", "/init-storage.sh"]
    depends_on: [minio]
  backup:
    image: postgres:17-alpine
    profiles: ["tools"]
    env_file: ./secrets/postgres.env
    volumes:
      - ./backups:/backups
      - ./backup-db.sh:/backup-db.sh:ro
    entrypoint: ["/bin/sh", "/backup-db.sh"]
networks:
  default:
    ipam:
      config: [{ subnet: 172.29.6.0/24 }]
volumes:
  postgres-data:
  manifests:
  api-data:
  caddy-data:
  caddy-config:

