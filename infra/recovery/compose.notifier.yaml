services:
  notifier:
    image: python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
    network_mode: container:wgmina
    user: "${YAMC_UID:?required}:${YAMC_GID:?required}"
    read_only: true
    cap_drop: [ALL]
    pids_limit: 32
    mem_limit: 96m
    cpus: 0.25
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./app:/app:ro
      - ./health:/health:ro
      - ./telegram.txt:/run/secrets/telegram.txt:ro
      - ./state:/state
    working_dir: /app
    entrypoint: [python, /app/notify_status.py]
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
