name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: dotnet test server/YetAnotherCat.Tests -m:1
      - run: dotnet publish server/YetAnotherCat.Api -c Release -o /tmp/yac-publish -m:1
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
# Public source checks; on-chain integration tests require a configured validator.
# SBF tests require the separately documented Solana toolchain/build artifact.
