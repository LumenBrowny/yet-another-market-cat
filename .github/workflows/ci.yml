name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/test-web-security.cjs
      - run: dotnet test server/YetAnotherCat.Tests -m:1
      - run: dotnet publish server/YetAnotherCat.Api -c Release -o /tmp/yac-publish -m:1
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
# Public source checks; on-chain integration tests require a configured validator.
# SBF tests require the separately documented Solana toolchain/build artifact.
