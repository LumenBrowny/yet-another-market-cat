[package]
name = "cat_shit_mining"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cat_shit_mining"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=0.32.1"
solana-sha256-hasher = "=2.3.0"
anchor-spl = { version = "=0.32.1", features = ["token", "associated_token"] }

[dev-dependencies]
serde_json = "1"
